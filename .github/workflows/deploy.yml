name: Deploy

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: europe-west2-docker.pkg.dev
  IMAGE: europe-west2-docker.pkg.dev/quizzy-416110/quizbot/quizbot

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Update container on GCE
        run: |
          gcloud compute instances update-container quizbot-20250606 \
            --zone=us-west1-c \
            --container-image="$IMAGE:${GITHUB_REF_NAME}"
